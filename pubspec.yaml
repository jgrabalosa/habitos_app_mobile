name: habitos_app_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # El motor del ecosistema: red, temas, gamificación, mascota, onboarding y
  # preferencias. Lo que vive ahí no sabe de hábitos.
  norday_flutter_core:
    git:
      url: https://github.com/jgrabalosa/norday_flutter_core.git
      ref: main
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: 2.2.2
  google_sign_in: ^6.2.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  in_app_review: ^2.0.12
  google_fonts: ^8.1.0
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.6
  permission_handler: ^11.3.1
  lottie: ^3.1.2
  audioplayers: ^6.1.0
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Lo único que no se comparte: el branding es de esta app. Animaciones,
    # sonidos, mascota y avatares los declara norday_flutter_core.
    - assets/branding/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  # Icono adaptativo: el fondo va a sangre y el símbolo se queda en la zona
  # segura (72dp de 108dp), así que es el launcher quien decide la forma —
  # círculo, squircle o lo que use el fabricante.
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: assets/branding/icono_adaptativo_frente.png
  # El PNG ya viene con la zona segura calculada, así que el inset del 16%
  # que mete el paquete por defecto sobra: encogería el símbolo dos veces.
  adaptive_icon_foreground_inset: 0
  # Respaldo para Android 7, que no entiende iconos adaptativos. El PNG de
  # 512 es el que va a sangre; icono_app_1024.png trae esquinas negras.
  image_path: assets/branding/icono_app_512x512.png
  min_sdk_android: 24

flutter_native_splash:
  color: "0A1628"
  image: assets/branding/simbolo_negativo.png
  android_12:
    color: "0A1628"
    # Android 12+ ignora `image` y dibuja el icono del launcher salvo que se
    # le dé uno propio. Este va a 1152x1152 con el símbolo en los 768 px
    # centrales: el sistema recorta el tercio exterior del lienzo.
    image: assets/branding/simbolo_android12.png
